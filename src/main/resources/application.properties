spring.application.name=Swen3

# Defaults for running locally (e.g. from the IDE against the postgres container).
# Inside docker-compose these are overridden via SPRING_DATASOURCE_* environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/paperless
spring.datasource.username=paperless
spring.datasource.password=paperless
spring.jpa.hibernate.ddl-auto=update

# RabbitMQ (inside docker-compose the host is overridden via SPRING_RABBITMQ_HOST)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=paperless
spring.rabbitmq.password=paperless
spring.rabbitmq.connection-timeout=5s
paperless.rabbitmq.ocr-queue=paperless.ocr
paperless.rabbitmq.ocr-dead-letter-queue=paperless.ocr.dlq

# Logging
logging.level.root=INFO
logging.level.at.fhtw.swen3=INFO
