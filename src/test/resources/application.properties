spring.datasource.url=jdbc:h2:mem:swen3test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
paperless.rabbitmq.ocr-queue=paperless.ocr
paperless.rabbitmq.ocr-dead-letter-queue=paperless.ocr.dlq

# RustFS
paperless.storage.endpoint=http://localhost:9000
paperless.storage.access-key=rustfsadmin
paperless.storage.secret-key=rustfsadmin
paperless.storage.bucket=paperless-documents

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=paperless
spring.rabbitmq.password=paperless
