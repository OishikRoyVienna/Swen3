spring.application.name=genai-worker
# RabbitMQ (inside docker-compose the host is overridden via SPRING_RABBITMQ_HOST)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=paperless
spring.rabbitmq.password=paperless
paperless.rabbitmq.genai-queue=paperless.genai
paperless.rabbitmq.genai-dead-letter-queue=paperless.genai.dlq
paperless.rabbitmq.summary-queue=paperless.summary
# Fehlgeschlagene Aufträge nicht endlos neu zustellen (sonst würde Gemini im Sekundentakt aufgerufen)
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Google Gemini über Spring AI. Der API-Key kommt NUR aus der Umgebung (.env), nie aus dem Repo.
# Ohne .env greift der Platzhalter: der Worker startet trotzdem, nur die Gemini-Aufrufe schlagen dann fehl.
spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY:not-configured}
# gemini-2.5-flash (aus den Folien) ist für neue API-Keys nicht mehr verfügbar
spring.ai.google.genai.chat.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.3

# Kurzzeitige Gemini-Fehler (Netzwerk, 5xx, Rate-Limit 429) bis zu 3x wiederholen, mit kurzer Wartezeit.
# Andere 4xx (z. B. falscher API-Key) werden nicht wiederholt, das würde nichts ändern.
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10s
spring.ai.retry.on-http-codes=429

# Logging
logging.level.root=INFO
logging.level.at.fhtw.swen3.genai=INFO
