<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperless – Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <a href="index.html" class="brand">Paperless</a>
    <nav><a href="index.html" class="active">Dashboard</a></nav>
</header>

<main class="container">
    <section class="card">
        <h1>Add document</h1>
        <form id="document-form" novalidate>
            <div class="form-row">
                <label for="title">Title *</label>
                <input id="title" name="title" data-field="title" type="text" maxlength="255" required>
                <span class="field-error" id="title-error"></span>
            </div>
            <div class="form-row">
                <label for="filename">Filename *</label>
                <input id="filename" name="filename" data-field="filename" type="text" maxlength="255"
                       placeholder="invoice-2026.pdf" required>
                <span class="field-error" id="filename-error"></span>
            </div>
            <div class="form-row">
                <label for="contentType">Content type</label>
                <input id="contentType" name="contentType" data-field="contentType" type="text" maxlength="255"
                       list="content-types" placeholder="application/pdf">
                <datalist id="content-types">
                    <option value="application/pdf">
                    <option value="image/png">
                    <option value="image/jpeg">
                    <option value="text/plain">
                </datalist>
                <span class="field-error" id="contentType-error"></span>
            </div>
            <button type="submit" class="btn primary">Save document</button>
            <p id="form-message" class="message" hidden></p>
        </form>
    </section>

    <section class="card">
        <div class="section-header">
            <h1>Documents</h1>
            <input id="search" type="search" placeholder="Filter by title or filename…" aria-label="Filter documents">
        </div>
        <p id="list-message" class="message" hidden></p>
        <table class="table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Filename</th>
                <th>Content type</th>
                <th>Uploaded</th>
                <th>Comments</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="document-rows"></tbody>
        </table>
        <p id="empty-state" class="muted" hidden>No documents yet.</p>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
