spring.application.name=ocr-worker

# RabbitMQ (inside docker-compose the host is overridden via SPRING_RABBITMQ_HOST)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=paperless
spring.rabbitmq.password=paperless
paperless.rabbitmq.ocr-queue=paperless.ocr
paperless.rabbitmq.ocr-dead-letter-queue=paperless.ocr.dlq

# A failed message is not put back into the queue (no endless redelivery loop) but moved to the dead-letter queue
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Logging
logging.level.root=INFO
logging.level.at.fhtw.swen3.ocr=INFO
